[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-spock"
version = "0.1.0"
description = "Visual editor for branching story timelines"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
time-spock = "time_spock.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]